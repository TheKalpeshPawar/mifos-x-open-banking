<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Returning to the app…</title>
  <style>
    :root { color-scheme: light dark; }
    body {
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      display: flex; align-items: center; justify-content: center;
      min-height: 100vh; margin: 0; padding: 1.5rem; text-align: center;
    }
    main { max-width: 26rem; }
    h1 { font-size: 1.25rem; margin: 0 0 .5rem; }
    p { margin: 0 0 1rem; line-height: 1.5; opacity: .8; }
    button {
      font: inherit; padding: .6rem 1.2rem; border-radius: .5rem;
      border: 1px solid currentColor; background: transparent; cursor: pointer;
    }
    #manual { display: none; }
  </style>
</head>
<body>
<main>
  <h1 id="heading">Returning to the app…</h1>
  <p id="detail">You can close this tab once the app reopens.</p>
  <div id="manual">
    <button type="button" id="retry">Reopen the app</button>
  </div>
</main>

<script src="bridge.js"></script>
<script>
  /*
   * Bridge for the HSBC OBIE consent redirect. The logic lives in bridge.js so it can be tested
   * (`node --test`); this file is only the wiring and the UI.
   *
   * Two delivery paths run, because the page cannot tell which platform opened it:
   *   - custom scheme -> Android intent-filter / iOS CFBundleURLSchemes
   *   - loopback      -> desktop HttpServer on 127.0.0.1:8765
   */
  (function main() {
    var raw = readParams(window.location.hash, window.location.search);

    if (!raw) {
      document.getElementById('heading').textContent = 'Nothing to return';
      document.getElementById('detail').textContent =
        'This page had no authorisation response to pass back to the app.';
      return;
    }

    /*
     * Desktop first, and without blocking. If a desktop app is listening this succeeds and it takes
     * over; if not, the fetch fails silently and the custom scheme below handles mobile. `no-cors`
     * keeps the browser from complaining about the opaque loopback response.
     */
    try {
      fetch(loopbackUrl(raw), { mode: 'no-cors', cache: 'no-store' }).catch(function () {});
    } catch (e) { /* desktop app not running — the mobile path below handles it */ }

    var target = appUrl(raw);
    document.getElementById('retry').onclick = function () { window.location.href = target; };

    // Mobile: hand off to the native app via the custom scheme.
    window.location.href = target;

    /*
     * If the hand-off worked we are backgrounded by now and this never runs. If the browser refused
     * it — iOS Safari blocks custom-scheme navigation that no user gesture initiated — offer a tap
     * rather than leave the PSU on a page that looks stalled.
     */
    setTimeout(function () {
      document.getElementById('heading').textContent = 'Open the app to continue';
      document.getElementById('detail').textContent =
        'Your bank has authorised the request. Reopen the app to finish connecting.';
      document.getElementById('manual').style.display = 'block';
    }, 1500);
  })();
</script>
</body>
</html>
